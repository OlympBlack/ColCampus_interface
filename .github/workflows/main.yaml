name: Deploy Frontend on push

on: 
  push: 
    branches: [main]

jobs:
  web-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      # Récupère le code source du dépôt GitHub dans le runner
      - name: Get latest code
        uses: actions/checkout@v4

      # Installe Node.js pour la compilation
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Installe les dépendances du projet
      - name: Install dependencies
        run: npm ci

      # Compile le frontend React/Vite (génère le dossier dist/)
      - name: Build frontend
        run: npm run build

      # Envoie directement le contenu compilé de dist/ vers la racine du domaine frontend
      - name: Sync dist files directly to domain
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          local-dir: ./dist/
          exclude: |
            **/.git*
            **/.git*/**

    #something new